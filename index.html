<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Tips</title>
  <meta name="description" content="개발 관련 핵심 팁과 체크리스트를 읽는 Markdown 뷰어">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" id="hljs-light">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" id="hljs-dark" disabled>
  <link rel="stylesheet" href="assets/viewer.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('pt.theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#content">본문으로 건너뛰기</a>

  <header class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="목차 열기" aria-controls="sidebar" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/">📚 <span>Pocket Tips</span></a>
    <div class="search">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="제목·본문 검색  ( / )" autocomplete="off" aria-label="문서 검색">
    </div>
    <button class="icon-btn" id="theme-btn" aria-label="테마 전환" title="테마 전환">
      <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="문서 목차">
      <div class="recent" id="recent" hidden></div>
      <nav class="tree" id="tree"></nav>
      <div class="search-results" id="search-results" hidden></div>
    </aside>

    <main class="content" id="content">
      <nav class="breadcrumb" id="breadcrumb" aria-label="현재 위치"></nav>
      <article class="markdown-body" id="article">
        <p class="muted">불러오는 중…</p>
      </article>
      <nav class="pager" id="pager" aria-label="이전·다음 문서"></nav>
      <footer class="doc-footer" id="doc-footer"></footer>
    </main>

    <aside class="toc" id="toc" aria-label="이 페이지 목차"></aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script type="module" src="assets/viewer.js"></script>
</body>
</html>
